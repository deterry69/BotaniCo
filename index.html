<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>botaniCO</title>
     <meta name="description" content="Plataforma que conecta personas con causas vegetales urgentes sin andarse por las ramas.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="preload" as="image" href="https://res.cloudinary.com/da9tytxsu/image/upload/f_auto,q_auto,w_1920/v1791389120/background_gqgj0n.png">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
    <div class="navbar__inner">
      <a class="navbar__brand" href="/">
        <img class="navbar__logo" src="assets/logo.png" alt="BotaniCo Logo">
        <span>botaniCO</span>
      </a>
        <nav class="navbar__nav" aria-label="Navegación principal">
          <ul class="navbar__links">
            <li><a class="navbar__link" href="#buscar-cuidador">Buscar cuidador</a></li>
            <li><a class="navbar__link" href="#hazte-cuidador">Hazte cuidador</a></li>
            <li><a class="navbar__link" href="#causas">Causas</a></li>
            <li><a class="navbar__link" href="#como-funciona">Cómo funciona</a></li>
          </ul>
        <a class="navbar__login" href="#iniciar-sesion">Iniciar sesión</a>
        <a class="btn btn--primary navbar__cta" href="#registro">Registrarse</a>
        </nav>
    </div>
    </header>

    <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="container hero__inner">
        <h1 class="hero__title" id="hero-title">
          Ayúdanos a crecer <strong>¿Qué necesitas?</strong>
        </h1>

        <form class="search glass" action="#" method="get" role="search" aria-label="Buscar cuidados para plantas">
          <div class="search__col">
            <div class="kind-switch" role="group" aria-label="Tipo de elemento">
              <button class="kind-switch__btn" type="button" aria-pressed="true">Plantas</button>
              <button class="kind-switch__btn" type="button" aria-pressed="false">Árboles</button>
              <button class="kind-switch__btn" type="button" aria-pressed="false">Flores</button>
              <button class="kind-switch__btn" type="button" aria-pressed="false">Jardines</button>
            </div>

            <h2 class="search__question" id="care-question">¿Qué tipo de cuidados necesitan tus plantas?</h2>

            <ul class="care" aria-labelledby="care-question">
              <li>
                <button class="care__btn" type="button" aria-pressed="false">
                  <img class="care__icon" src="assets/icons/regar.svg" alt="" aria-hidden="true">
                  <span>Regar</span>
                </button>
              </li>
              <li>
                <button class="care__btn" type="button" aria-pressed="false">
                  <img class="care__icon" src="assets/icons/podar.svg" alt="" aria-hidden="true">
                  <span>Podar</span>
                </button>
              </li>
              <li>
                <button class="care__btn" type="button" aria-pressed="false">
                  <img class="care__icon" src="assets/icons/transplantar.svg" alt="" aria-hidden="true">
                  <span>Transplantar</span>
                </button>
              </li>
              <li>
                <button class="care__btn" type="button" aria-pressed="false">
                  <img class="care__icon" src="assets/icons/injertar.svg" alt="" aria-hidden="true">
                  <span>Injertar</span>
                </button>
              </li>
              <li>
                <button class="care__btn" type="button" aria-pressed="false">
                  <img class="care__icon" src="assets/icons/abonar.svg" alt="" aria-hidden="true">
                  <span>Abonar</span>
                </button>
              </li>
              <li>
                <button class="care__btn" type="button" aria-pressed="false">
                  <img class="care__icon" src="assets/icons/donar.svg" alt="" aria-hidden="true">
                  <span>Donar</span>
                </button>
              </li>
            </ul>
          </div>

          <div class="search__col">
            <div class="role-toggle" role="group" aria-label="¿Qué quieres hacer?">
              <button class="role-toggle__btn" type="button" aria-pressed="true">Necesito ayuda</button>
              <button class="role-toggle__btn" type="button" aria-pressed="false">Quiero ayudar</button>
            </div>

            <div class="field">
              <label class="field__label" for="search-where">¿Dónde?</label>
              <div class="field__control">
                <input class="field__input" id="search-where" name="where" type="text"
                       placeholder="Añade una dirección" autocomplete="street-address">
              </div>
            </div>

            <fieldset class="field">
              <legend class="field__label">¿En qué fecha te viene bien?</legend>

              <div class="field__control field__control--icon">
                <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="18" rx="2"/>
                  <path d="M16 2v4M8 2v4M3 10h18"/>
                </svg>
                <input class="field__input" id="search-from" name="from" type="text"
                       placeholder="Inicio" aria-label="Fecha de inicio">
              </div>

              <div class="field__control field__control--icon">
                <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="18" rx="2"/>
                  <path d="M16 2v4M8 2v4M3 10h18"/>
                </svg>
                <input class="field__input" id="search-to" name="to" type="text"
                       placeholder="Fin" aria-label="Fecha de fin">
              </div>
            </fieldset>

            <button class="btn btn--primary btn--block search__submit" type="submit">Buscar</button>
          </div>
        </form>
      </div>
    </section>
  </main>

</body>
</html>
